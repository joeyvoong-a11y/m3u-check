name: tests

on: [push, pull_request]

jobs:
  test:
    # Lägsta (requires-python) och nyaste Python, på Linux och Windows: UTF-8-
    # och sökvägshanteringen i cli.py beter sig olika på Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
